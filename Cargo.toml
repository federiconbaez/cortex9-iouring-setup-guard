[package]
name = "iouring-setup-guard"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
description = "Userspace allowlist guard for io_uring_setup flags + residual CVE catalog"
repository = "https://github.com/federiconbaez/cortex9-iouring-setup-guard"
authors = ["Federico Nicolas Báez Rizzo"]
publish = false
default-run = "iouring-setup-guard"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[[bin]]
name = "iouring-setup-guard"
path = "src/main.rs"

[[bin]]
name = "iouring-setup-enforce"
path = "src/bin/iouring-setup-enforce.rs"

[lib]
name = "iouring_setup_guard"
path = "src/lib.rs"
